<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Tree & Submission Tracker</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        :root {
            --bg-blue: #2b659b;
            --sidebar-blue: #1a4266;
            --accent-green: #4CAF50;
            --danger-red: #d93025;
            --whatsapp-green: #075e54;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; display: flex; height: 100vh; overflow: hidden;
            font-family: Arial, sans-serif; background: var(--bg-blue);
        }
        /* Sidebar & Layout */
        #sidebar { width: 280px; background: var(--sidebar-blue); color: white; display: flex; flex-direction: column; z-index: 10; }
        #sidebar-header { padding: 20px; font-size: 18px; font-weight: bold; border-bottom: 1px solid rgba(255,255,255,.1); }
        #project-list { flex: 1; overflow-y: auto; }
        .project-title { padding: 14px 18px 8px; font-size: 12px; text-transform: uppercase; opacity: .6; }
        .root-item { padding: 10px 18px 10px 35px; cursor: pointer; border-left: 4px solid transparent; }
        .root-item:hover { background: rgba(255,255,255,.08); }
        .root-item.active { background: rgba(255,255,255,.12); border-left-color: var(--accent-green); }
        #btn-add-project { margin: 14px; padding: 10px; cursor: pointer; border: none; background: var(--accent-green); color: white; border-radius: 4px; }
        #main-content { flex: 1; position: relative; }
        
        /* Tree Visuals */
        #tree-container { width: 100%; height: 100%; }
        svg { width: 100%; height: 100%; cursor: grab; }
        .node rect { fill: var(--bg-blue); stroke: white; rx: 6; ry: 6; stroke-width: 1.5px; cursor: pointer; }
        .node text { fill: white; font-size: 12px; pointer-events: none; }
        .link { fill: none; stroke: white; stroke-opacity: .4; }

        /* Floating Schedule */
        #floating-schedule {
            position: absolute; top: 20px; right: 20px; width: 320px;
            background: white; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            z-index: 3000; overflow: hidden; border: 1px solid #ccc;
        }
        #schedule-header {
            padding: 8px 12px; background: #f1f1f1; cursor: move;
            font-size: 11px; font-weight: bold; color: #555;
            display: flex; justify-content: space-between; border-bottom: 1px solid #ddd;
        }
        #schedule-content {
            padding: 15px; font-size: 13px; line-height: 1.6; color: #333;
            min-height: 100px; max-height: 400px; overflow-y: auto; outline: none; white-space: pre-wrap;
        }

        /* Context Menu */
        #context-menu {
            position: absolute; display: none; background: white; border-radius: 8px;
            overflow: hidden; min-width: 180px; z-index: 4000; box-shadow: 0 6px 18px rgba(0,0,0,.2);
        }
        #context-menu button { width: 100%; border: none; background: none; text-align: left; padding: 12px; cursor: pointer; font-size: 13px; }
        #context-menu button:hover { background: #f0f0f0; }
        .delete-btn { color: var(--danger-red); border-top: 1px solid #eee !important; }
        
        /* Chat View */
        #chat-view { position: absolute; inset: 0; background: #e5ddd5; display: none; flex-direction: column; z-index: 5000; }
        #chat-header { background: var(--whatsapp-green); color: white; padding: 15px; display: flex; align-items: center; }
        #chat-messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; }
        .msg { background: #dcf8c6; padding: 10px; border-radius: 8px; margin-bottom: 10px; max-width: 70%; align-self: flex-end; word-wrap: break-word; box-shadow: 0 1px 2px rgba(0,0,0,0.1); }
        #chat-input { background: #f0f0f0; padding: 12px; display: flex; gap: 10px; align-items: center; }
        #chat-text { flex: 1; border: none; border-radius: 20px; padding: 10px 14px; outline: none; }
        #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.8); color: white; padding: 10px 14px; border-radius: 8px; display: none; z-index: 9999; }
    </style>
</head>
<body>

<div id="sidebar">
    <div id="sidebar-header">Projects</div>
    <div id="project-list"></div>
    <button id="btn-add-project">+ New Project</button>
</div>

<div id="main-content">
    <div id="floating-schedule">
        <div id="schedule-header">
            <span>SUBMISSION SCHEDULE</span>
            <span style="opacity:0.5">⠿</span>
        </div>
        <div id="schedule-content" contenteditable="true" onblur="saveSchedule()"></div>
    </div>

    <div id="tree-container"></div>

    <div id="chat-view">
        <div id="chat-header">
            <button onclick="closeChat()" style="margin-right:10px;background:none;border:none;color:white;font-size:20px;cursor:pointer;">←</button>
            <span id="chat-title"></span>
        </div>
        <div id="chat-messages"></div>
        <div id="chat-input">
            <input type="file" id="chat-file" style="display: none;" />
            <label for="chat-file" style="cursor: pointer; color: #54656f; display:flex; align-items:center;">
                <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
            </label>
            <input id="chat-text" placeholder="Type message..." onkeypress="if(event.key==='Enter') sendMsg()"/>
            <button onclick="sendMsg()" style="cursor:pointer; padding: 8px 15px; border-radius: 20px; border: none; background: var(--accent-green); color: white;">Send</button>
        </div>
    </div>
</div>

<div id="context-menu">
    <button id="btn-branch">New Child Branch</button>
    <button id="btn-sibling">New Sibling Branch</button>
    <button id="btn-open">Open Chat</button>
    <button id="btn-new-root">Create Another Root</button>
    <button id="btn-delete" class="delete-btn">Delete Branch</button>
</div>

<div id="toast"></div>

<script>
// --- CONFIG & STATE ---
const nodeW = 110; const nodeH = 34; const gap = 170;
let projects = []; 
let activeProjectIdx = 0; 
let activeRootId = null; 
let selectedNode = null; 
let currentNodeId = null;

const DEFAULT_PROJECTS = [{
    name: "Main Project",
    treeData: { id: "Super", isSuper: true, children: [{ name: "Main Project", id: "r1", isRoot: true, children: [] }] }
}];

// --- INITIALIZATION ---
dragElement(document.getElementById("floating-schedule"));
loadProjects();

// --- API & PERSISTENCE ---
async function apiGetProjects() {
    const res = await fetch("/api/projects");
    if (!res.ok) throw new Error("Load failed");
    return res.json();
}

async function apiSaveProjects() {
    await fetch("/api/projects", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ projects })
    });
}

async function loadProjects() {
    try {
        const data = await apiGetProjects();
        projects = data.projects?.length ? data.projects : DEFAULT_PROJECTS;
        activeProjectIdx = 0;
        activeRootId = projects[0].treeData.children[0]?.id;
        renderSidebar(); updateTree(); loadSchedule();
    } catch (e) {
        projects = DEFAULT_PROJECTS;
        activeProjectIdx = 0; activeRootId = "r1";
        renderSidebar(); updateTree();
    }
}

async function persistProjects() {
    try { await apiSaveProjects(); } catch (err) { showToast("Save failed"); }
}

// --- SCHEDULE LOGIC ---
async function loadSchedule() {
    if (!activeRootId) return;
    try {
        const res = await fetch(`/api/schedule?projectId=${activeRootId}`);
        const data = await res.json();
        document.getElementById("schedule-content").innerText = data.content || "";
    } catch (e) { document.getElementById("schedule-content").innerText = ""; }
}

async function saveSchedule() {
    const content = document.getElementById("schedule-content").innerText;
    await fetch(`/api/schedule?projectId=${activeRootId}`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content })
    });
    showToast("Schedule updated");
}

// --- TREE LOGIC (D3) ---
const svg = d3.select("#tree-container").append("svg");
const g = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.3, 3]).on("zoom", e => g.attr("transform", e.transform)));
const tree = d3.tree().nodeSize([60, gap]);

function updateTree() {
    if (!projects.length) return;
    const project = projects[activeProjectIdx];
    const rootNode = project.treeData.children.find(c => c.id === activeRootId);
    const root = d3.hierarchy({ id: "Super", isSuper: true, children: rootNode ? [rootNode] : [] }, d => d.children);
    
    tree(root);
    const nodes = root.descendants().filter(d => !d.data.isSuper);
    const links = root.links().filter(d => !d.source.data.isSuper);

    const link = g.selectAll(".link").data(links, d => d.target.data.id);
    link.exit().remove();
    link.enter().insert("path", "g").attr("class", "link").merge(link)
        .attr("d", d => `M${d.source.y + nodeW/2},${d.source.x}H${(d.source.y + d.target.y)/2}V${d.target.x}H${d.target.y - nodeW/2}`);

    const node = g.selectAll(".node").data(nodes, d => d.data.id);
    node.exit().remove();
    const enter = node.enter().append("g").attr("class", "node").on("click", (e, d) => {
        e.stopPropagation(); selectedNode = d;
        const menu = document.getElementById("context-menu");
        menu.style.display = "block"; menu.style.left = e.pageX + "px"; menu.style.top = e.pageY + "px";
        
        // Context menu visibility rules
        document.getElementById("btn-new-root").style.display = d.data.isRoot ? "block" : "none";
        document.getElementById("btn-sibling").style.display = d.data.isRoot ? "none" : "block";
    });
    enter.append("rect").attr("width", nodeW).attr("height", nodeH).attr("x", -nodeW/2).attr("y", -nodeH/2);
    enter.append("text").attr("text-anchor", "middle").attr("dy", ".35em");
    enter.merge(node).attr("transform", d => `translate(${d.y},${d.x})`).select("text").text(d => d.data.name);
}

// --- CONTEXT MENU HANDLERS ---
document.getElementById("btn-branch").onclick = async () => {
    const name = prompt("Branch Name:"); if (!name) return;
    const realNode = findNodeById(projects[activeProjectIdx].treeData, selectedNode.data.id);
    if (!realNode.children) realNode.children = [];
    realNode.children.push({ name, id: makeId("node"), children: [] });
    updateTree(); await persistProjects();
};

document.getElementById("btn-sibling").onclick = async () => {
    if (!selectedNode.parent) return;
    const name = prompt("Sibling Name:"); if (!name) return;
    const parentNode = findNodeById(projects[activeProjectIdx].treeData, selectedNode.parent.data.id);
    parentNode.children.push({ name, id: makeId("node"), children: [] });
    updateTree(); await persistProjects();
};

document.getElementById("btn-new-root").onclick = async () => {
    const name = prompt("New Root Name:"); if (!name) return;
    const newRoot = { name, id: makeId("root"), isRoot: true, children: [] };
    projects[activeProjectIdx].treeData.children.push(newRoot);
    activeRootId = newRoot.id;
    renderSidebar(); updateTree(); await persistProjects();
};

document.getElementById("btn-delete").onclick = async () => {
    if (selectedNode.data.isRoot) return showToast("Cannot delete project root");
    if (!confirm("Delete this branch?")) return;
    const parent = findNodeById(projects[activeProjectIdx].treeData, selectedNode.parent.data.id);
    parent.children = parent.children.filter(c => c.id !== selectedNode.data.id);
    updateTree(); await persistProjects();
};

document.getElementById("btn-add-project").onclick = async () => {
    const name = prompt("Project Name:"); if (!name) return;
    const id = makeId("proj");
    projects.push({ name, treeData: { id: `s_${id}`, isSuper: true, children: [{ name, id: `r_${id}`, isRoot: true, children: [] }] } });
    activeProjectIdx = projects.length - 1;
    activeRootId = projects[activeProjectIdx].treeData.children[0].id;
    renderSidebar(); updateTree(); loadSchedule(); await persistProjects();
};

// --- CHAT LOGIC ---
document.getElementById("btn-open").onclick = () => {
    currentNodeId = selectedNode.data.id;
    document.getElementById("chat-title").innerText = selectedNode.data.name;
    document.getElementById("chat-messages").innerHTML = "";
    loadChatMessages(currentNodeId);
    document.getElementById("chat-view").style.display = "flex";
};

async function loadChatMessages(nodeId) {
    const container = document.getElementById("chat-messages");
    try {
        const res = await fetch(`/api/chat?nodeId=${nodeId}`);
        const data = await res.json();
        if (data.messages) {
            data.messages.forEach(m => {
                const msg = typeof m === 'string' ? JSON.parse(m) : m;
                appendMessageToUI(msg.text);
            });
        }
    } catch (e) { console.error("Chat load error", e); }
}

async function sendMsg() {
    const input = document.getElementById("chat-text");
    const text = input.value.trim();
    if (!text || !currentNodeId) return;
    appendMessageToUI(text);
    input.value = "";
    try {
        await fetch(`/api/chat?nodeId=${currentNodeId}`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ text })
        });
    } catch (e) { showToast("Message save failed"); }
}

function appendMessageToUI(text) {
    const div = document.createElement("div");
    div.className = "msg"; div.innerText = text;
    const container = document.getElementById("chat-messages");
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
}

function closeChat() { document.getElementById("chat-view").style.display = "none"; }

// --- HELPERS ---
function makeId(p) { return `${p}_${Math.random().toString(36).slice(2,9)}`; }

function findNodeById(node, id) {
    if (node.id === id) return node;
    for (const child of node.children || []) {
        const found = findNodeById(child, id);
        if (found) return found;
    }
    return null;
}

function renderSidebar() {
    const list = document.getElementById("project-list");
    list.innerHTML = "";
    projects.forEach((p, idx) => {
        p.treeData.children.forEach(root => {
            const item = document.createElement("div");
            item.className = `root-item ${root.id === activeRootId && idx === activeProjectIdx ? "active" : ""}`;
            item.innerText = `↳ ${root.name}`;
            item.onclick = () => { activeProjectIdx = idx; activeRootId = root.id; renderSidebar(); updateTree(); loadSchedule(); };
            list.appendChild(item);
        });
    });
}
 
function showToast(text) {
    const t = document.getElementById("toast");
    t.innerText = text; t.style.display = "block";
    setTimeout(() => t.style.display = "none", 2000);
}

function dragElement(elmnt) {
    let p1 = 0, p2 = 0, p3 = 0, p4 = 0;
    const header = document.getElementById("schedule-header");
    header.onmousedown = (e) => {
        e.preventDefault(); p3 = e.clientX; p4 = e.clientY;
        document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
        document.onmousemove = (e) => {
            e.preventDefault();
            p1 = p3 - e.clientX; p2 = p4 - e.clientY;
            p3 = e.clientX; p4 = e.clientY;
            elmnt.style.top = (elmnt.offsetTop - p2) + "px";
            elmnt.style.left = (elmnt.offsetLeft - p1) + "px";
            elmnt.style.right = "auto";
        };
    };
}

window.onclick = (e) => {
    if (!document.getElementById("context-menu").contains(e.target)) {
        document.getElementById("context-menu").style.display = "none";
    }
};
</script>
</body>
</html>
